name: Terraform CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-ci:

    name: Terraform Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/dev

    steps:

      #########################################################
      # Checkout Repository
      #########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # Install Terraform
      #########################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      #########################################################
      # Install Azure CLI
      #########################################################

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      #########################################################
      # Azure Login (TEMP - Replace placeholders locally only)
      #########################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "REPLACE_WITH_CLIENT_ID"
          tenant-id: "REPLACE_WITH_TENANT_ID"
          subscription-id: "REPLACE_WITH_SUBSCRIPTION_ID"
          client-secret: "REPLACE_WITH_CLIENT_SECRET"

      #########################################################
      # Verify Login
      #########################################################

      - name: Verify Azure Login
        run: |
          az account show
          az account list --output table

      #########################################################
      # Terraform Version
      #########################################################

      - name: Terraform Version
        run: terraform version

      #########################################################
      # Terraform Init
      #########################################################

      - name: Terraform Init
        run: terraform init

      #########################################################
      # Terraform Format
      #########################################################

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

      #########################################################
      # Terraform Validate
      #########################################################

      - name: Terraform Validate
        run: terraform validate

      #########################################################
      # Terraform Plan
      #########################################################

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      #########################################################
      # Show Plan
      #########################################################

      - name: Show Terraform Plan
        run: terraform show tfplan

      #########################################################
      # Upload Artifact
      #########################################################

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environment/dev/tfplan